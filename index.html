    <script>
      // Single Page Apps for GitHub Pages (MIT, https://github.com/rafgraph/spa-github-pages).
      // Restores the route that public/404.html encoded into the query string.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
