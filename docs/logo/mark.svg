<!-- File: mark.svg | Purpose: Portfolio-inator logo (mark) | Author: Akilesh S | Date: 2026-10-22 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Portfolio-inator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1636B5"/>
      <stop offset="1" stop-color="#0A1A4F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CF3FF"/>
      <stop offset="1" stop-color="#7CF3FF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- beam: a widening cone from the emitter tip to the page -->
  <path d="M50 64 L74 40 L74 88 Z" fill="url(#beam)"/>
  <!-- the page being built: a portfolio card -->
  <g transform="rotate(6 92 64)">
    <rect x="70" y="34" width="42" height="60" rx="7" fill="#F4F7FF"/>
    <rect x="70" y="34" width="42" height="12" rx="7" fill="#C9D5FF"/>
    <rect x="70" y="40" width="42" height="6" fill="#C9D5FF"/>
    <circle cx="77" cy="40" r="2" fill="#1636B5"/>
    <circle cx="83" cy="40" r="2" fill="#1636B5" opacity=".55"/>
    <rect x="77" y="53" width="22" height="5" rx="2.5" fill="#0A1A4F"/>
    <rect x="77" y="62" width="28" height="3.5" rx="1.75" fill="#7D8BB8"/>
    <rect x="77" y="69" width="24" height="3.5" rx="1.75" fill="#7D8BB8"/>
    <rect x="77" y="80" width="12" height="7" rx="3.5" fill="#1636B5"/>
  </g>
  <!-- the -inator: a stubby ray emitter on a little stand -->
  <path d="M30 82 L26 96 M38 82 L42 96 M22 96 H46" stroke="#AFC0FF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="14" y="56" width="22" height="26" rx="6" fill="#E6ECFF"/>
  <path d="M34 54 L50 60 L50 68 L34 74 Z" fill="#AFC0FF"/>
  <path d="M39 56.2 V71.8 M44.5 58.2 V69.8" stroke="#1636B5" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <circle cx="51" cy="64" r="5" fill="#7CF3FF"/>
  <circle cx="51" cy="64" r="2.2" fill="#FFFFFF"/>
  <rect x="19" y="62" width="12" height="4" rx="2" fill="#1636B5"/>
  <rect x="19" y="70" width="7" height="4" rx="2" fill="#1636B5" opacity=".55"/>
  <!-- sparks -->
  <path d="M60 30 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#7CF3FF"/>
  <circle cx="64" cy="100" r="2.5" fill="#7CF3FF" opacity=".8"/>
</svg>
