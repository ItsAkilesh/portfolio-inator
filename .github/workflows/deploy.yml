# File: deploy.yml
# Purpose: Build the portfolio and publish the build output to ItsAkilesh/itsakilesh.github.io,
#          using the source commit message and SHA as the deploy commit message.
# Author: Akilesh S
# Date: 2026-10-19

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages-repo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      CI: false
      GENERATE_SOURCEMAP: false
    steps:
      - name: Log trigger details
        run: |
          echo "::group::Trigger"
          echo "Event:   ${{ github.event_name }}"
          echo "Ref:     ${{ github.ref }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Runner:  ${{ runner.os }} / ${{ runner.arch }}"
          echo "::endgroup::"

      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20.18.1
          cache: pnpm

      - name: Install dependencies
        run: |
          echo "Node $(node -v), pnpm $(pnpm -v)"
          pnpm install --no-frozen-lockfile --prefer-offline --reporter=default
          echo "Installed $(ls node_modules | wc -l) top-level entries in node_modules"

      - name: Restore build cache
        uses: actions/cache@v4.2.0
        with:
          path: node_modules/.cache
          key: build-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: build-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: |
          echo "Building with react-scripts (sourcemaps disabled)"
          pnpm run build
          echo "::group::Build output"
          du -sh build
          find build -type f | wc -l | xargs echo "Files:"
          echo "::endgroup::"

      - name: Write build summary
        run: |
          {
            echo "### Build complete"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Build size: $(du -sh build | cut -f1)"
            echo "- Files: $(find build -type f | wc -l)"
            echo "- Target: ItsAkilesh/itsakilesh.github.io (main)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build to itsakilesh.github.io
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ItsAkilesh/itsakilesh.github.io
          publish_branch: main
          publish_dir: ./build
          user_name: ${{ github.actor }}
          user_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual deploy' }} (${{ github.sha }})"

      - name: Log deploy result
        run: echo "Published build of ${{ github.sha }} to ItsAkilesh/itsakilesh.github.io"
